
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My JavaScript Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    <form class="form-add-bookmark" action="">
        <div  class="form-header">
            <p class="form-title">New bookmark</p>
            <p class="form-close">X</p>
        </div>
        <input class="form-input" placeholder="Title" type="text" id="form-title" name="website name" />
        <input class="form-input" placeholder="URL" type="text" id="form-url" name="website url" />
        <input class="form-input" placeholder="Description" type="text" id="form-desc" name="website desc" />
        <input class="form-input" placeholder="Tags {comma separated}" type="text" id="form-tags" name="tags" />
        <input class="form-input" placeholder="Image link" type="text" id="form-site-image" name="website icon image" />
        <button class="form-submit-button" type="button">Create!</button>
    </form>
    <div class="container">
        <section class="menu">
            <div class="app-name">
                <img src="">
                <h3>Bookmark Manager</h3>
            </div>
            <div class="sub-menu">
                <p>Home</p>
                <p>Archived</p>
            </div>
            <div class="tags">
                <p>Tags</p>
                <p>ai</p>
                <p>devops</p>
            </div>
        </section>
        <div class="interactive-bar">
            <input class="search" type="text" value="Search by title">
            <div class="nav-funcs">
                <button class="button-add-bookmark" type="button">+ Add Bookmark</button>
                <img src="profilepic.png" class="profile-image">
            </div>
        </div>
        <section class="main">
            <div class="main-header">
                <p class="main-header-title">All bookmarks</p>
                <button class="button-sort" type="button">Sort by</button>
            </div>
