---
kind: pipeline
type: docker
name: bookmark-manager

steps:
- name: build_backend_image
  image: docker:dind
  volumes:
    - name: dockersock
      path: /var/run/docker.sock
  environment:
    USERNAME:
      from_secret: GITEA_USERNAME
    PASSWORD:
      from_secret: GITEA_PASSWORD
  commands:
    - echo "$PASSWORD" | docker login --username "$USERNAME" gitea.jrzylab.xyz --password-stdin
    - cd backend/
    - VERSION=`cat VERSION`
    - docker build -t gitea.jrzylab.xyz/ramon/bookmark-manager/bookmark-manager-api:"$VERSION"-dev .
    - docker tag gitea.jrzylab.xyz/ramon/bookmark-manager/bookmark-manager-api:"$VERSION"-dev gitea.jrzylab.xyz/ramon/bookmark-manager/bookmark-manager-api:latest-dev
    - docker push gitea.jrzylab.xyz/ramon/bookmark-manager/bookmark-manager-api:"$VERSION"-dev
    - docker push gitea.jrzylab.xyz/ramon/bookmark-manager/bookmark-manager-api:latest-dev

- name: build_frontend_image
  image: docker:dind
  volumes:
    - name: dockersock
      path: /var/run/docker.sock
  environment:
    USERNAME:
      from_secret: GITEA_USERNAME
    PASSWORD:
      from_secret: GITEA_PASSWORD
  commands:
    - echo "$PASSWORD" | docker login --username "$USERNAME" gitea.jrzylab.xyz --password-stdin
    - cd frontend/
    - VERSION=`cat VERSION`
    - docker build -t gitea.jrzylab.xyz/ramon/bookmark-manager/bookmark-manager-ui:"$VERSION"-dev .
    - docker tag gitea.jrzylab.xyz/ramon/bookmark-manager/bookmark-manager-ui:"$VERSION"-dev gitea.jrzylab.xyz/ramon/bookmark-manager/bookmark-manager-ui:latest-dev
    - docker push gitea.jrzylab.xyz/ramon/bookmark-manager/bookmark-manager-ui:"$VERSION"-dev
    - docker push gitea.jrzylab.xyz/ramon/bookmark-manager/bookmark-manager-ui:latest-dev

