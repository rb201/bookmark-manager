services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookmark_manager_ui
    ports:
      - 8080:80
    depends_on:
      - api
      - db

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookmark_manager_api
    ports:
      - 3001:3001
    environment:
      - POSTGRES_HOST=bookmark_manager_db
    env_file:
      - backend/db/.env
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    container_name: bookmark_manager_db
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    ports:
      - 5432:5432
    env_file:
      - backend/db/.env
    volumes:
      - ./infra/database/db:/var/lib/postgresql

  adminer:
    image: adminer
    container_name: bookmark_manager_dbui
    restart: always
    ports:
      - 8081:8080
    depends_on:
      - db

networks:
  default:
    name: bm-svc