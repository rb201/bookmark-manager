<body>
    <form class="form-add-bookmark" action="">
        <div  class="form-header">
            <p class="form-title">New bookmark</p>
            <p class="button-close-form">X</p>
        </div>
        <input class="form-input" placeholder="Title" type="text" id="form-title" name="title" required/>
        <input class="form-input" placeholder="https://" type="text" id="form-url" name="url" required/>
        <input class="form-input" placeholder="Description" type="text" id="form-desc" name="desc" />
        <input class="form-input" placeholder="Tags {comma separated}" type="text" id="form-tags" name="tags" />
        <input class="form-input" placeholder="Image link" type="text" id="form-image-uri" name="imageUrl" required/>
        <button class="form-submit-button" type="submit">Create!</button>
    </form>
    <div class="container">
        <section class="menu">
            <div class="app-name">
                <img class="side-menu-bookmark-img" src="js/images/bookmark.svg">
                <h3>Bookmark Manager</h3>
            </div>

            <div class="side-menu">
                <div class="side-menu-item-container isActive">
                    <img class="side-menu-item-home-img" src="js/images/home.svg">
                    <p class="side-menu-item">Home</p>
                </div>

                <div class="side-menu-item-container">
                    <img class="side-menu-item-archive-img" src="js/images/archive.svg">
                    <p class="side-menu-item">Archive</p>
                </div>

                <div class="side-menu-item-container">
                    <img class="side-menu-item-trash-img" src="js/images/recycle-bin.svg">
                    <p class="side-menu-item">Trash</p>
                </div>
            </div>

            <div class="tags">
                <p>Tags</p>
                <p>ai</p>
                <p>devops</p>
            </div>
        </section>

        <div class="interactive-bar">
            <input class="search" type="text" placeholder="Search by title">
            <div class="nav-funcs">
                <button class="button-add-bookmark" type="button">+ Add Bookmark</button>
                <img src="profilepic.png" class="profile-image">
            </div>
        </div>

        <section class="main">
            <div class="main-header">
                <p class="main-header-title">All bookmarks</p>
                <button class="button-sort" type="button">Sort by</button>
